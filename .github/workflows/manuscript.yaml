name: manuscript

# Builds the manuscript PDF and fails if the LaTeX does not compile.
#
# The text lives in the `overleaf/` submodule, which clones from the public
# mirror github.com/jeonglab-bcm/BARCS-tex. That means no credentials are
# needed for an ordinary build, and GitHub indexes the prose for search and
# diffs instead of showing an opaque submodule pointer.
#
# The Overleaf bridge is still the place coauthors edit, and it is
# authenticated. Reaching it directly is therefore optional here: set the
# OVERLEAF_GIT_TOKEN secret and the scheduled run will build straight from
# Overleaf, catching a broken edit before anyone has mirrored it. Without the
# secret the scheduled run falls back to the mirror's newest commit, which is
# still ahead of the pinned one.

on:
  push:
    branches: [main]
    paths:
      - overleaf
      - .github/workflows/manuscript.yaml
  pull_request:
    paths:
      - overleaf
      - .github/workflows/manuscript.yaml
  schedule:
    # Mondays 07:00 UTC.
    - cron: '0 7 * * 1'
  workflow_dispatch:
    inputs:
      use_latest:
        description: Build the newest manuscript commit rather than the pinned one
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pdf:
    runs-on: ubuntu-latest

    steps:
      # Only `overleaf/` is fetched. BARCS/ and CB2/ carry the R package and
      # the CB2 baseline and are not needed to typeset.
      - uses: actions/checkout@v4
        with:
          submodules: false

      - name: Check out the manuscript
        run: git submodule update --init --depth 1 overleaf

      - name: Move to the newest manuscript commit
        if: github.event_name == 'schedule' || inputs.use_latest
        env:
          OVERLEAF_GIT_TOKEN: ${{ secrets.OVERLEAF_GIT_TOKEN }}
          OVERLEAF_GIT_USER: ${{ secrets.OVERLEAF_GIT_USER || 'git' }}
        run: |
          if [ -n "${OVERLEAF_GIT_TOKEN}" ]; then
            echo "Building straight from the Overleaf bridge."
            git config --global credential.helper store
            printf 'https://%s:%s@latex.bioinfolder.com\n' \
              "${OVERLEAF_GIT_USER}" "${OVERLEAF_GIT_TOKEN}" > ~/.git-credentials
            chmod 600 ~/.git-credentials
            git -C overleaf remote add overleaf \
              https://git@latex.bioinfolder.com/git/6a6ec212d3ea56f57964b094
            git -C overleaf fetch --depth 1 overleaf main
            git -C overleaf checkout --detach FETCH_HEAD
            rm -f ~/.git-credentials
          else
            echo "::notice::OVERLEAF_GIT_TOKEN is not set, so this run builds" \
                 "the newest mirrored commit rather than reaching Overleaf" \
                 "directly. Unmirrored edits will not be seen."
            git -C overleaf fetch --depth 1 origin main
            git -C overleaf checkout --detach FETCH_HEAD
          fi

      - name: Report what is being built
        run: |
          echo "Manuscript commit: $(git -C overleaf rev-parse HEAD)"
          echo "LaTeX sources:     $(find overleaf -name '*.tex' | wc -l)"
          echo "Figures:           $(find overleaf/figures -name '*.pdf' 2>/dev/null | wc -l)"

      # Every figure the manuscript includes has to be committed alongside it;
      # this repository's figures/ is gitignored output. Checking here turns a
      # confusing LaTeX error into a clear one.
      - name: Check that every included figure exists
        shell: bash
        run: |
          missing=0
          while read -r figure; do
            if [ ! -f "overleaf/${figure}" ]; then
              echo "::error::${figure} is included by the manuscript but is not" \
                   "committed alongside it. Run scripts/publish_figures.sh, then" \
                   "scripts/manuscript_sync.sh."
              missing=$((missing + 1))
            fi
          done < <(grep -rhoE 'figures/[A-Za-z0-9_.-]+\.(pdf|png|jpg)' overleaf --include='*.tex' | sort -u)
          if [ "$missing" -gt 0 ]; then
            echo "${missing} included figure(s) are missing."
            exit 1
          fi
          echo "All included figures are present."

      - name: Compile
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: overleaf
          root_file: main.tex
          latexmk_shell_escape: false
          args: -pdf -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Summarise the result
        run: |
          {
            echo "### Manuscript built"
            echo
            echo "- Commit \`$(git -C overleaf rev-parse --short HEAD)\`"
            echo "- PDF size $(du -h overleaf/main.pdf | cut -f1)"
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: manuscript-pdf
          path: overleaf/main.pdf
          if-no-files-found: error

      # A failed compile is far easier to diagnose from the log than from
      # truncated console output.
      - name: Upload the LaTeX log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: latex-log
          path: |
            overleaf/main.log
            overleaf/main.blg
          if-no-files-found: ignore
